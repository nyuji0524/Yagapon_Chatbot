- id: drive-minutes
  category: trusted-operation
  question: "Google Driveでは議事録はどこに保存されますか"
  expected_all: ["保存先フォルダ", "直下", "Googleドキュメント"]
  reference_facts: ["議事録は設定されたGoogle Drive保存先フォルダの直下へGoogleドキュメントとして保存する"]
  expected_source_any: ["おしゃべりやがぽん運用仕様"]
  must_cite: true
  min_sources: 1

- id: drive-transcript
  category: trusted-operation
  question: "生文字起こしは議事録と同じファイルに入りますか。保存先も教えてください"
  expected_all: ["別", "文字起こし"]
  expected_any: ["サブフォルダ", "フォルダ"]
  reference_facts: ["生文字起こしは議事録とは別のGoogleドキュメントとして、保存先直下の文字起こしサブフォルダへ保存する"]
  expected_source_any: ["おしゃべりやがぽん運用仕様"]
  must_cite: true
  min_sources: 1

- id: recording-retention
  category: trusted-operation
  question: "正常に処理が終わった録音PCMは残りますか"
