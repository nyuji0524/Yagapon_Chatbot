name: Recording replay control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Replay the longest retained meeting or inspect a replay job
        required: true
        type: choice
        options: [replay-longest, status]
        default: replay-longest
      target_channel_id:
        description: Discord channel ID; empty selects a writable channel
        required: false
        type: string
      target_guild_id:
        description: Discord server ID; preferred over the configured server name
        required: false
        type: string
      retranscribe:
        description: Re-run STT from retained PCM instead of using the transcript
        required: false
        type: boolean
        default: false
      job_id:
        description: Replay job ID (status only)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: yagapon-recording-replay-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
      GCE_ZONE: ${{ vars.GCE_ZONE }}
      CONTROL_ACTION: ${{ inputs.action }}
      CONTROL_TARGET_GUILD_NAME: ${{ secrets.YAGAPON_RECORDING_TEST_GUILD_NAME }}
      CONTROL_TARGET_GUILD_ID: ${{ inputs.target_guild_id }}
      CONTROL_TARGET_CHANNEL_ID: ${{ inputs.target_channel_id }}
      CONTROL_RETRANSCRIBE: ${{ inputs.retranscribe }}
      CONTROL_JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: ">= 506.0.0"

      - name: Copy control script
        run: |
          gcloud compute scp \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCE_ZONE" \
            --tunnel-through-iap \
            deploy/recording-replay-control.sh \
            "$GCE_INSTANCE:/tmp/recording-replay-control.sh"

      - name: Run control action
        run: |
          action=$(printf '%q' "$CONTROL_ACTION")
          guild=$(printf '%q' "$CONTROL_TARGET_GUILD_NAME")
          guild_id=$(printf '%q' "$CONTROL_TARGET_GUILD_ID")
          channel=$(printf '%q' "$CONTROL_TARGET_CHANNEL_ID")
          retranscribe=$(printf '%q' "$CONTROL_RETRANSCRIBE")
          job=$(printf '%q' "$CONTROL_JOB_ID")
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCE_ZONE" \
            --tunnel-through-iap \
            --command "sudo /bin/bash /tmp/recording-replay-control.sh $action $guild $channel $retranscribe $job $guild_id"
