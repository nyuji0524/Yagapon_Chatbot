name: YagaPon AI Review

on:
  workflow_call:
    inputs:
      model:
        description: Gemini model ID
        required: false
        type: string
        default: gemini-3.8-flash
      thinking_level:
        description: Gemini thinking level
        required: false
        type: string
        default: medium
      reviewer_ref:
        description: Reviewed Yagapon_Chatbot ref containing the reviewer
        required: false
        type: string
        default: main
    secrets:
      GOOGLE_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: yagapon-ai-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted reviewer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nyuji0524/Yagapon_Chatbot
          ref: ${{ inputs.reviewer_ref }}
          path: yagapon-reviewer
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yagapon-reviewer/reviewer/requirements.txt
      - name: Install reviewer dependencies
        working-directory: yagapon-reviewer
        run: pip install --requirement reviewer/requirements.txt
      - name: Review Pull Request
        working-directory: yagapon-reviewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          YAGAPON_REVIEW_MODEL: ${{ inputs.model }}
          YAGAPON_REVIEW_THINKING: ${{ inputs.thinking_level }}
        run: python -m reviewer
