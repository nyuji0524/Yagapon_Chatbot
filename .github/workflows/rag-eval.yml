name: RAG Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

jobs:
  evaluate:
    if: vars.YAGAPON_RAG_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --requirement requirements-dev.txt
      - name: Run representative queries
        env:
          YAGAPON_API_TOKEN: ${{ secrets.YAGAPON_RAG_EVAL_API_TOKEN }}
        run: |
          python -m rag_eval \
            --base-url "${{ vars.YAGAPON_RAG_EVAL_BASE_URL }}" \
            --guild-id "${{ vars.YAGAPON_RAG_EVAL_GUILD_ID }}" \
            --cases docs/rag-eval-cases.yaml \
            --min-pass-rate 0.8 \
            --output rag-eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-eval-report
          path: rag-eval-report.json
          if-no-files-found: warn
