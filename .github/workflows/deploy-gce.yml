name: Deploy to GCE

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: yagapon-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.YAGAPON_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCE_INSTANCE: ${{ vars.GCE_INSTANCE }}
      GCE_ZONE: ${{ vars.GCE_ZONE }}
      IMAGE_REPOSITORY: ${{ vars.GCP_ARTIFACT_IMAGE }}
      DEPLOY_STAGE: /tmp/yagapon-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        run: |
          set -eu
          test -n "$GCP_PROJECT_ID"
          test -n "$GCE_INSTANCE"
          test -n "$GCE_ZONE"
          test -n "$IMAGE_REPOSITORY"
          case "$IMAGE_REPOSITORY" in
            *-docker.pkg.dev/*/*/*) ;;
            *) echo "GCP_ARTIFACT_IMAGE must be a full Artifact Registry image path" >&2; exit 1 ;;
          esac

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: ">= 506.0.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        env:
          IMAGE_SHA: ${{ vars.GCP_ARTIFACT_IMAGE }}:${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          registry="${IMAGE_REPOSITORY%%/*}"
          gcloud auth configure-docker "$registry" --quiet
          if gcloud artifacts docker images describe "$IMAGE_SHA" >/dev/null 2>&1; then
            echo "Reusing existing image: $IMAGE_SHA"
            echo "IMAGE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "IMAGE_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Build and push uncached image
        if: env.IMAGE_EXISTS != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_ARTIFACT_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=yagapon-production-image
          cache-to: type=gha,mode=max,scope=yagapon-production-image

      - name: Deploy and verify health
        env:
          IMAGE_SHA: ${{ vars.GCP_ARTIFACT_IMAGE }}:${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          quoted_image=$(printf '%q' "$IMAGE_SHA")
          quoted_stage=$(printf '%q' "$DEPLOY_STAGE")
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCE_ZONE" \
            --tunnel-through-iap \
            --command "sudo test -x /opt/yagapon/deploy/remote-bootstrap.sh || exit 42; sudo /opt/yagapon/deploy/remote-bootstrap.sh $quoted_image $quoted_stage"
          deploy_status=$?
          set -e
          if [[ "$deploy_status" == 42 ]]; then
            # One-time migration for a newly provisioned or legacy VM. Normal
            # releases never open this second IAP connection or transfer files.
            bootstrap_tmp="/tmp/yagapon-remote-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}.sh"
            gcloud compute scp \
              --project "$GCP_PROJECT_ID" \
              --zone "$GCE_ZONE" \
              --tunnel-through-iap \
              deploy/remote-bootstrap.sh "$GCE_INSTANCE:$bootstrap_tmp"
            quoted_bootstrap_tmp=$(printf '%q' "$bootstrap_tmp")
            gcloud compute ssh "$GCE_INSTANCE" \
              --project "$GCP_PROJECT_ID" \
              --zone "$GCE_ZONE" \
              --tunnel-through-iap \
              --command "sudo install -D -o root -g root -m 0755 $quoted_bootstrap_tmp /opt/yagapon/deploy/remote-bootstrap.sh && rm -f $quoted_bootstrap_tmp && sudo /opt/yagapon/deploy/remote-bootstrap.sh $quoted_image $quoted_stage"
          elif [[ "$deploy_status" != 0 ]]; then
            exit "$deploy_status"
          fi
