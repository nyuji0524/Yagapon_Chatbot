services:
  yagapon:
    image: ${YAGAPON_IMAGE:-yagapon-chatbot:local}
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - ${YAGAPON_ENV_FILE:-.env}
    environment:
      # The shared env_file must never expose source-index credentials here.
      YAGAPON_SOURCE_GITHUB_APP_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY_FILE: ""
      YAGAPON_SOURCE_GITHUB_TOKEN: ""
      YAGAPON_SOURCE_GITHUB_TOKEN_FILE: ""
      # A separate actions:write App can request Knowledge intake.  Its PEM
      # is never read from the shared env file or shared /data volume.
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID: ${YAGAPON_KNOWLEDGE_GITHUB_APP_ID:-}
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID: ${YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID:-}
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/knowledge-github-app-private-key.pem
      YAGAPON_KNOWLEDGE_INTAKE_DISPATCH_ENABLED: ${YAGAPON_KNOWLEDGE_INTAKE_DISPATCH_ENABLED:-true}
      YAGAPON_KNOWLEDGE_INTAKE_WORKFLOW: ${YAGAPON_KNOWLEDGE_INTAKE_WORKFLOW:-yagapon-intake.yml}
      API_PORT: "8000"
      YAGAPON_RAG_REQUIRE_ANSWER_STATUS: ${YAGAPON_RAG_REQUIRE_ANSWER_STATUS:-true}
      YAGAPON_RAG_REQUIRE_GROUNDING_SUPPORTS: ${YAGAPON_RAG_REQUIRE_GROUNDING_SUPPORTS:-true}
      YAGAPON_RAG_GROUNDING_COVERAGE_THRESHOLD: ${YAGAPON_RAG_GROUNDING_COVERAGE_THRESHOLD:-0.8}
      YAGAPON_FILE_SEARCH_UPLOAD_START_TIMEOUT_SECONDS: ${YAGAPON_FILE_SEARCH_UPLOAD_START_TIMEOUT_SECONDS:-180}
      YAGAPON_FILE_SEARCH_INDEX_TIMEOUT_SECONDS: ${YAGAPON_FILE_SEARCH_INDEX_TIMEOUT_SECONDS:-1800}
      YAGAPON_CONFIG_PATH: /data/server_config.json
      YAGAPON_CATALOG_PATH: /data/knowledge-catalog.json
      YAGAPON_RAG_DB_PATH: /data/rag.sqlite3
      YAGAPON_KEY_DB_PATH: /data/key-management.sqlite3
      YAGAPON_VOICEPRINT_DIR: /data/voiceprints
      YAGAPON_RECORDING_DIR: /data/recordings
      YAGAPON_TRANSCRIPT_DIR: /data/transcripts
      YAGAPON_REPLAY_DIR: /data/replays
      YAGAPON_KNOWLEDGE_OUTBOX: /data/knowledge-outbox
      GOOGLE_OAUTH_AUTHORIZED_USER_JSON: ${YAGAPON_GOOGLE_OAUTH_FILE:-}
      YAGAPON_SUPPORT_BACKEND: ${YAGAPON_SUPPORT_BACKEND:-disabled}
      YAGAPON_SUPPORT_FIREBASE_PROJECT: ${YAGAPON_SUPPORT_FIREBASE_PROJECT:-demo-yagapon-support}
      YAGAPON_SUPPORT_FIRESTORE_EMULATOR_HOST: ${YAGAPON_SUPPORT_FIRESTORE_EMULATOR_HOST:-support-firestore:8080}
      YAGAPON_SUPPORT_ROLE_SYNC_ENABLED: ${YAGAPON_SUPPORT_ROLE_SYNC_ENABLED:-false}
      YAGAPON_FIREBASE_KNOWLEDGE_ENABLED: ${YAGAPON_FIREBASE_KNOWLEDGE_ENABLED:-false}
      YAGAPON_FIREBASE_KNOWLEDGE_BACKEND: ${YAGAPON_FIREBASE_KNOWLEDGE_BACKEND:-public}
      YAGAPON_FIREBASE_KNOWLEDGE_PROJECT: ${YAGAPON_FIREBASE_KNOWLEDGE_PROJECT:-}
      YAGAPON_FIREBASE_KNOWLEDGE_API_KEY: ${YAGAPON_FIREBASE_KNOWLEDGE_API_KEY:-}
      YAGAPON_FIREBASE_KNOWLEDGE_EMULATOR_HOST: ${YAGAPON_FIREBASE_KNOWLEDGE_EMULATOR_HOST:-support-firestore:8080}
      YAGAPON_FIREBASE_KNOWLEDGE_TIMEOUT_SECONDS: ${YAGAPON_FIREBASE_KNOWLEDGE_TIMEOUT_SECONDS:-8}
      YAGAPON_FIREBASE_KNOWLEDGE_CACHE_SECONDS: ${YAGAPON_FIREBASE_KNOWLEDGE_CACHE_SECONDS:-60}
      YAGAPON_FIREBASE_KNOWLEDGE_LIMIT: ${YAGAPON_FIREBASE_KNOWLEDGE_LIMIT:-100}
      YAGAPON_FIREBASE_KNOWLEDGE_MAX_DOCUMENTS: ${YAGAPON_FIREBASE_KNOWLEDGE_MAX_DOCUMENTS:-2000}
      YAGAPON_KNOWLEDGE_GUILD_ID: ${YAGAPON_KNOWLEDGE_GUILD_ID:-}
      YAGAPON_KNOWLEDGE_ALLOWED_GUILD_IDS: ${YAGAPON_KNOWLEDGE_ALLOWED_GUILD_IDS:-}
      YAGAPON_KNOWLEDGE_DENY_CHANNEL_IDS: ${YAGAPON_KNOWLEDGE_DENY_CHANNEL_IDS:-}
      YAGAPON_KNOWLEDGE_DENY_CHANNEL_TERMS: ${YAGAPON_KNOWLEDGE_DENY_CHANNEL_TERMS:-選考}
      YAGAPON_KNOWLEDGE_GCS_BUCKET: ${YAGAPON_KNOWLEDGE_GCS_BUCKET:-}
      YAGAPON_SCHEDULED_BACKFILL_ENABLED: ${YAGAPON_SCHEDULED_BACKFILL_ENABLED:-false}
      YAGAPON_SCHEDULED_BACKFILL_GUILD_IDS: ${YAGAPON_SCHEDULED_BACKFILL_GUILD_IDS:-}
      YAGAPON_SCHEDULED_BACKFILL_CHANNEL_IDS: ${YAGAPON_SCHEDULED_BACKFILL_CHANNEL_IDS:-}
      YAGAPON_SCHEDULED_BACKFILL_STATE: /data/scheduled-backfill-state.json
      YAGAPON_SCHEDULED_BACKFILL_INTERVAL_SECONDS: ${YAGAPON_SCHEDULED_BACKFILL_INTERVAL_SECONDS:-21600}
      YAGAPON_SCHEDULED_BACKFILL_RETRY_SECONDS: ${YAGAPON_SCHEDULED_BACKFILL_RETRY_SECONDS:-900}
      YAGAPON_SCHEDULED_BACKFILL_INITIAL_DELAY_SECONDS: ${YAGAPON_SCHEDULED_BACKFILL_INITIAL_DELAY_SECONDS:-300}
      YAGAPON_KNOWLEDGE_CURATION_ENABLED: ${YAGAPON_KNOWLEDGE_CURATION_ENABLED:-false}
      YAGAPON_KNOWLEDGE_CURATION_STATE: /data/knowledge-curation.sqlite3
      YAGAPON_KNOWLEDGE_BACKFILL_STATE: /data/scheduled-backfill-state.json
      YAGAPON_KNOWLEDGE_PIPELINE_LOCK: /data/knowledge-pipeline.lock
      YAGAPON_KNOWLEDGE_CURATION_CHANNEL_IDS: ${YAGAPON_KNOWLEDGE_CURATION_CHANNEL_IDS:-}
      YAGAPON_KNOWLEDGE_CURATION_BATCH: ${YAGAPON_KNOWLEDGE_CURATION_BATCH:-3}
      YAGAPON_KNOWLEDGE_CURATION_MODEL_CALLS_PER_RUN: ${YAGAPON_KNOWLEDGE_CURATION_MODEL_CALLS_PER_RUN:-6}
      YAGAPON_KNOWLEDGE_CURATION_GENERATIONS_PER_RUN: ${YAGAPON_KNOWLEDGE_CURATION_GENERATIONS_PER_RUN:-3}
      YAGAPON_KNOWLEDGE_CURATION_MAX_OPEN_BUNDLES: ${YAGAPON_KNOWLEDGE_CURATION_MAX_OPEN_BUNDLES:-5}
      YAGAPON_KNOWLEDGE_CURATION_RETRIES_PER_RUN: ${YAGAPON_KNOWLEDGE_CURATION_RETRIES_PER_RUN:-3}
    ports:
      - "${YAGAPON_BIND_ADDRESS:-127.0.0.1}:${YAGAPON_HOST_PORT:-8000}:8000"
    volumes:
      - ${YAGAPON_DATA_PATH:-./data}:/data
      - ${YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_HOST_FILE:-/dev/null}:/run/secrets/knowledge-github-app-private-key.pem:ro
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  knowledge-sync:
    image: ${YAGAPON_IMAGE:-yagapon-chatbot:local}
    build:
      context: .
    profiles: [tools]
    env_file:
      - ${YAGAPON_ENV_FILE:-.env}
    environment:
      YAGAPON_SOURCE_GITHUB_APP_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY_FILE: ""
      YAGAPON_SOURCE_GITHUB_TOKEN: ""
      YAGAPON_SOURCE_GITHUB_TOKEN_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_FILE: ""
      YAGAPON_DRIVE_SYNC_STATE: /data/drive-sync-state.json
      YAGAPON_KNOWLEDGE_OUTPUT: /data/knowledge-drafts
      GOOGLE_OAUTH_AUTHORIZED_USER_JSON: ${YAGAPON_GOOGLE_OAUTH_FILE:-}
    volumes:
      - ${YAGAPON_DATA_PATH:-./data}:/data
    command: ["python", "-m", "knowledge_sync"]
    healthcheck:
      disable: true

  source-index-watch:
    image: ${YAGAPON_IMAGE:-yagapon-chatbot:local}
    build:
      context: .
    depends_on:
      yagapon:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ${YAGAPON_ENV_FILE:-.env}
    environment:
      # Force read_secret() past direct env values to the worker-only PEM.
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_SOURCE_GITHUB_TOKEN: ""
      YAGAPON_CONFIG_PATH: /data/server_config.json
      YAGAPON_RAG_DB_PATH: /data/rag.sqlite3
      YAGAPON_SOURCE_INDEX_STATE: /data/source-index-state.json
      YAGAPON_RELEASE_METADATA: /data/releases/current.json
      YAGAPON_SOURCE_INDEX_ENABLED: ${YAGAPON_SOURCE_INDEX_ENABLED:-false}
      # Production must follow the complete reviewed manifest. Set false only
      # for an intentional local subset selected by YAGAPON_SOURCE_REPOSITORIES.
      YAGAPON_SOURCE_REQUIRE_FULL_MANIFEST: ${YAGAPON_SOURCE_REQUIRE_FULL_MANIFEST:-true}
      YAGAPON_SOURCE_REPOSITORIES: ${YAGAPON_SOURCE_REPOSITORIES:-}
      YAGAPON_SOURCE_UPLOAD_CONCURRENCY: ${YAGAPON_SOURCE_UPLOAD_CONCURRENCY:-2}
      YAGAPON_FILE_SEARCH_UPLOAD_START_TIMEOUT_SECONDS: ${YAGAPON_FILE_SEARCH_UPLOAD_START_TIMEOUT_SECONDS:-180}
      YAGAPON_FILE_SEARCH_INDEX_TIMEOUT_SECONDS: ${YAGAPON_FILE_SEARCH_INDEX_TIMEOUT_SECONDS:-1800}
      YAGAPON_SOURCE_GITHUB_APP_ID: ${YAGAPON_SOURCE_GITHUB_APP_ID:-}
      YAGAPON_SOURCE_GITHUB_APP_ID_FILE: ${YAGAPON_SOURCE_GITHUB_APP_ID_FILE:-}
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID: ${YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID:-}
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID_FILE: ${YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID_FILE:-}
      # Keep the long-lived PEM out of the shared /data mount. Only this worker
      # receives the read-only bind below; every other service sees no key file.
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-private-key.pem
      YAGAPON_SOURCE_GITHUB_TOKEN_FILE: ""
      # The source reader must never inherit the separate actions:write App.
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_FILE: ""
      YAGAPON_SOURCE_HISTORY_SINCE: ${YAGAPON_SOURCE_HISTORY_SINCE:-2024-10-01T00:00:00+09:00}
      YAGAPON_SOURCE_HISTORY_UNTIL: ${YAGAPON_SOURCE_HISTORY_UNTIL:-}
      YAGAPON_SOURCE_HISTORY_COMMITS_PER_CYCLE: ${YAGAPON_SOURCE_HISTORY_COMMITS_PER_CYCLE:-100}
      YAGAPON_SOURCE_HISTORY_MAX_COMMITS: ${YAGAPON_SOURCE_HISTORY_MAX_COMMITS:-2000}
      YAGAPON_SOURCE_HISTORY_MAX_PAGES: ${YAGAPON_SOURCE_HISTORY_MAX_PAGES:-20}
      YAGAPON_SOURCE_HISTORY_MAX_FILES_PER_COMMIT: ${YAGAPON_SOURCE_HISTORY_MAX_FILES_PER_COMMIT:-300}
      YAGAPON_SOURCE_HISTORY_MAX_BYTES_PER_REPOSITORY: ${YAGAPON_SOURCE_HISTORY_MAX_BYTES_PER_REPOSITORY:-20000000}
      YAGAPON_SOURCE_HISTORY_MIN_RATE_REMAINING: ${YAGAPON_SOURCE_HISTORY_MIN_RATE_REMAINING:-200}
      YAGAPON_SOURCE_HISTORY_MAX_FILE_SNAPSHOTS_PER_REPOSITORY: ${YAGAPON_SOURCE_HISTORY_MAX_FILE_SNAPSHOTS_PER_REPOSITORY:-10}
      YAGAPON_KNOWLEDGE_GUILD_ID: ${YAGAPON_KNOWLEDGE_GUILD_ID:-0}
    volumes:
      - ${YAGAPON_DATA_PATH:-./data}:/data
      - ${YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY_HOST_FILE:-/dev/null}:/run/secrets/github-app-private-key.pem:ro
    command: ["python", "-m", "source_index", "--watch-interval", "900"]
    healthcheck:
      disable: true

  knowledge-curation-watch:
    image: ${YAGAPON_IMAGE:-yagapon-chatbot:local}
    build:
      context: .
    depends_on:
      yagapon:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ${YAGAPON_ENV_FILE:-.env}
    environment:
      YAGAPON_SOURCE_GITHUB_APP_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY_FILE: ""
      YAGAPON_SOURCE_GITHUB_TOKEN: ""
      YAGAPON_SOURCE_GITHUB_TOKEN_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID: ${YAGAPON_KNOWLEDGE_GITHUB_APP_ID:-}
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID: ${YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID:-}
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/knowledge-github-app-private-key.pem
      YAGAPON_KNOWLEDGE_INTAKE_DISPATCH_ENABLED: ${YAGAPON_KNOWLEDGE_INTAKE_DISPATCH_ENABLED:-true}
      YAGAPON_KNOWLEDGE_INTAKE_WORKFLOW: ${YAGAPON_KNOWLEDGE_INTAKE_WORKFLOW:-yagapon-intake.yml}
      YAGAPON_CONFIG_PATH: /data/server_config.json
      YAGAPON_RAG_DB_PATH: /data/rag.sqlite3
      YAGAPON_KNOWLEDGE_OUTBOX: /data/knowledge-outbox
      YAGAPON_KNOWLEDGE_GCS_BUCKET: ${YAGAPON_KNOWLEDGE_GCS_BUCKET:-}
      YAGAPON_KNOWLEDGE_GUILD_ID: ${YAGAPON_KNOWLEDGE_GUILD_ID:-}
      YAGAPON_KNOWLEDGE_ALLOWED_GUILD_IDS: ${YAGAPON_KNOWLEDGE_ALLOWED_GUILD_IDS:-}
      YAGAPON_KNOWLEDGE_DENY_CHANNEL_IDS: ${YAGAPON_KNOWLEDGE_DENY_CHANNEL_IDS:-}
      YAGAPON_KNOWLEDGE_DENY_CHANNEL_TERMS: ${YAGAPON_KNOWLEDGE_DENY_CHANNEL_TERMS:-選考}
      YAGAPON_KNOWLEDGE_CURATION_ENABLED: ${YAGAPON_KNOWLEDGE_CURATION_ENABLED:-false}
      YAGAPON_KNOWLEDGE_CURATION_STATE: /data/knowledge-curation.sqlite3
      YAGAPON_KNOWLEDGE_BACKFILL_STATE: /data/scheduled-backfill-state.json
      YAGAPON_KNOWLEDGE_PIPELINE_LOCK: /data/knowledge-pipeline.lock
      # The consumer must validate a checkpoint against the exact producer
      # inventory, not merely trust a still-fresh file from an older deploy.
      YAGAPON_SCHEDULED_BACKFILL_ENABLED: ${YAGAPON_SCHEDULED_BACKFILL_ENABLED:-false}
      YAGAPON_SCHEDULED_BACKFILL_GUILD_IDS: ${YAGAPON_SCHEDULED_BACKFILL_GUILD_IDS:-}
      YAGAPON_SCHEDULED_BACKFILL_CHANNEL_IDS: ${YAGAPON_SCHEDULED_BACKFILL_CHANNEL_IDS:-}
      YAGAPON_SCHEDULED_BACKFILL_STATE: /data/scheduled-backfill-state.json
      YAGAPON_KNOWLEDGE_CURATION_CHANNEL_IDS: ${YAGAPON_KNOWLEDGE_CURATION_CHANNEL_IDS:-}
      YAGAPON_KNOWLEDGE_CURATION_BATCH: ${YAGAPON_KNOWLEDGE_CURATION_BATCH:-3}
      YAGAPON_KNOWLEDGE_CURATION_MODEL_CALLS_PER_RUN: ${YAGAPON_KNOWLEDGE_CURATION_MODEL_CALLS_PER_RUN:-6}
      YAGAPON_KNOWLEDGE_CURATION_GENERATIONS_PER_RUN: ${YAGAPON_KNOWLEDGE_CURATION_GENERATIONS_PER_RUN:-3}
      YAGAPON_KNOWLEDGE_CURATION_MAX_OPEN_BUNDLES: ${YAGAPON_KNOWLEDGE_CURATION_MAX_OPEN_BUNDLES:-5}
      YAGAPON_KNOWLEDGE_CURATION_RETRIES_PER_RUN: ${YAGAPON_KNOWLEDGE_CURATION_RETRIES_PER_RUN:-3}
      YAGAPON_KNOWLEDGE_CURATION_RETRY_SECONDS: ${YAGAPON_KNOWLEDGE_CURATION_RETRY_SECONDS:-900}
    volumes:
      - ${YAGAPON_DATA_PATH:-./data}:/data
      - ${YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_HOST_FILE:-/dev/null}:/run/secrets/knowledge-github-app-private-key.pem:ro
    command:
      - python
      - -m
      - knowledge_curation
      - --watch-interval
      - ${YAGAPON_KNOWLEDGE_CURATION_INTERVAL_SECONDS:-21600}
    healthcheck:
      disable: true

  knowledge-sync-watch:
    image: ${YAGAPON_IMAGE:-yagapon-chatbot:local}
    build:
      context: .
    profiles: [knowledge]
    restart: unless-stopped
    env_file:
      - ${YAGAPON_ENV_FILE:-.env}
    environment:
      YAGAPON_SOURCE_GITHUB_APP_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_SOURCE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_SOURCE_GITHUB_APP_PRIVATE_KEY_FILE: ""
      YAGAPON_SOURCE_GITHUB_TOKEN: ""
      YAGAPON_SOURCE_GITHUB_TOKEN_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_FILE: ""
      YAGAPON_DRIVE_SYNC_STATE: /data/drive-sync-state.json
      YAGAPON_KNOWLEDGE_OUTPUT: /data/knowledge-drafts
      GOOGLE_OAUTH_AUTHORIZED_USER_JSON: ${YAGAPON_GOOGLE_OAUTH_FILE:-}
    volumes:
      - ${YAGAPON_DATA_PATH:-./data}:/data
    command: ["python", "-m", "knowledge_sync", "--watch-interval", "900"]
    healthcheck:
      disable: true

  support-firestore:
    build:
      context: ./firebase-emulator
    profiles: [support-emulator]
    restart: unless-stopped
    environment:
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_FILE: ""
    ports:
      - "${YAGAPON_SUPPORT_EMULATOR_BIND_ADDRESS:-127.0.0.1}:${YAGAPON_SUPPORT_EMULATOR_PORT:-8080}:8080"
      - "${YAGAPON_SUPPORT_EMULATOR_BIND_ADDRESS:-127.0.0.1}:${YAGAPON_SUPPORT_EMULATOR_UI_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s

  support-emulator-seed:
    image: ${YAGAPON_IMAGE:-yagapon-chatbot:local}
    build:
      context: .
    profiles: [support-emulator]
    depends_on:
      support-firestore:
        condition: service_healthy
    environment:
      FIRESTORE_EMULATOR_HOST: support-firestore:8080
      YAGAPON_SUPPORT_FIREBASE_PROJECT: ${YAGAPON_SUPPORT_FIREBASE_PROJECT:-demo-yagapon-support}
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_INSTALLATION_ID_FILE: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY: ""
      YAGAPON_KNOWLEDGE_GITHUB_APP_PRIVATE_KEY_FILE: ""
    command: ["python", "-m", "bot.support_emulator_seed"]
    healthcheck:
      disable: true
